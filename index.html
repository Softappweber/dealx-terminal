<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeX Terminal - FYERS</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
</head>
<body>
    <div id="loginScreen" class="login-screen">
        <div class="login-box">
            <h1>TradeX Terminal</h1>
            <p>Fastest Web Terminal for FYERS</p>
            <button onclick="loginWithFyers()">Login with FYERS</button>
        </div>
    </div>

    <div id="terminalScreen" class="terminal hidden">
        <header class="topbar">
            <div class="logo">TradeX</div>
            <div class="user-info">
                <span id="userName"></span>
                <button onclick="logout()">Logout</button>
            </div>
        </header>

        <div class="terminal-layout">
            <aside class="sidebar">
                <div class="watchlist">
                    <h3>Watchlist</h3>
                    <input type="text" id="stockSearch" placeholder="Search stock..." onkeyup="searchStock(event)">
                    <div id="watchlistItems"></div>
                </div>
                <div class="positions">
                    <h3>Positions</h3>
                    <div id="positionsList"></div>
                </div>
            </aside>

            <main class="main-area">
                <div class="chart-container">
                    <div id="chart"></div>
                </div>
                <div class="order-panel">
                    <h3>Place Order</h3>
                    <div class="order-form">
                        <input type="text" id="orderSymbol" placeholder="Symbol (e.g. NSE:RELIANCE-EQ)">
                        <input type="number" id="orderQty" placeholder="Quantity">
                        <select id="orderType">
                            <option value="1">Market</option>
                            <option value="2">Limit</option>
                            <option value="3">Stop Loss</option>
                        </select>
                        <input type="number" id="orderPrice" placeholder="Price (for limit)">
                        <div class="order-buttons">
                            <button class="buy-btn" onclick="placeOrder(1)">BUY</button>
                            <button class="sell-btn" onclick="placeOrder(-1)">SELL</button>
                        </div>
                    </div>
                </div>
                <div class="orders-list">
                    <h3>Orders</h3>
                    <div id="ordersList"></div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://s3.tradingview.com/tv.js"></script>
    <script src="app.js"></script>
</body>
</html>
